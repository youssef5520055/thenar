name: Thenar CI & Security Pipeline

on:
  push:
    branches: [ main, develop, 'security/**', 'feature/**', 'fix/**' ]
  pull_request:
    branches: [ main, develop ]

permissions:
  contents: read

jobs:
  audit-and-lint:
    name: Security Audit & Quality Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Security Audit (Production Dependencies)
        run: npm audit --omit=dev

      - name: TypeScript & Client Build
        run: npm run build

      - name: Run JavaScript / TypeScript Tests
        run: npm run test:all

  python-tests:
    name: Enrollment Service Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: apps/enrollment/requirements.txt

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r apps/enrollment/requirements.txt

      - name: Run Pytest Suite
        env:
          PYTHONPATH: .
        run: pytest apps/enrollment/tests
